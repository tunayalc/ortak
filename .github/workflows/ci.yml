name: Tests and ARM64 images
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOOGLE_MAPS_API_KEY: ''
      GOOGLE_MAPS_CALLS_ENABLED: 'false'
      LLM_PROVIDER: disabled
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python scripts/scan_public.py
      - run: pip install --require-hashes -r backend/requirements.lock
      - run: python -m pytest backend/tests -q --junitxml=output/deployment/backend-tests.xml
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npx playwright install --with-deps chromium
      - working-directory: frontend
        run: npm run test:e2e
      - working-directory: frontend
        run: npm audit --audit-level=high
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: test-results
          path: |
            output/deployment/backend-tests.xml
            frontend/test-results/ui.xml
          retention-days: 7
  images:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [api, web]
        include:
          - service: api
            dockerfile: backend/Dockerfile
          - service: web
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        id: build
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/tunayalc/ortak-${{ matrix.service }}:sha-${{ github.sha }}
            ghcr.io/tunayalc/ortak-${{ matrix.service }}:${{ github.ref_name }}
          labels: org.opencontainers.image.source=https://github.com/tunayalc/ortak
      - run: echo 'ARM64 ${{ matrix.service }} digest ${{ steps.build.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
