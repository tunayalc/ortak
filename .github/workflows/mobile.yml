name: Mobile validation
on:
  pull_request:
    paths: ['mobile/**', 'backend/**', '.github/workflows/mobile.yml']
  push:
    branches: [main]
    paths: ['mobile/**', 'backend/**', '.github/workflows/mobile.yml']
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run doctor
      - run: npm run check:native
      - run: npm audit --audit-level=moderate
      - run: npm run export
      # No EAS upload, signing credentials, live Google requests or store submission.
